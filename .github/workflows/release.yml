name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release, commit updates.json to main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags and history, for release notes

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag must match manifest version
        id: version
        run: |
          version=$(node -p 'require("./src/manifest.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src/manifest.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Syntax check
        run: pnpm check

      - name: web-ext lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Sign (AMO, unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: pnpm sign

      - name: Collect signed .xpi
        id: xpi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(web-ext-artifacts/*.xpi)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one signed .xpi, found ${#files[@]}"
            exit 1
          fi
          out="minifox-$VERSION.xpi"
          mv "${files[0]}" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Release notes (commits since the previous tag)
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          {
            echo "## Changes"
            echo
            git log "$range" --no-merges --format='- %s (%h)' \
              | grep -vE '^- (Release v[0-9]|Update updates\.json)' || echo "- No changes"
            echo
            echo "Install: download \`minifox-${GITHUB_REF_NAME#v}.xpi\` and drag it into Firefox."
            echo "Finicky config: \`finicky.js\` → \`~/.finicky.js\`."
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          XPI: ${{ steps.xpi.outputs.path }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$XPI" extras/finicky.js \
            --title "Minifox $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

      - name: Update updates.json on main
        env:
          VERSION: ${{ steps.version.outputs.version }}
          XPI: ${{ steps.xpi.outputs.path }}
        run: |
          link="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$XPI"
          cp "$XPI" "$RUNNER_TEMP/"
          git fetch origin main
          git checkout -B main origin/main
          node scripts/updates-json.mjs "$VERSION" "$RUNNER_TEMP/$XPI" "$link"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "Update updates.json for $GITHUB_REF_NAME"
          git push origin main
